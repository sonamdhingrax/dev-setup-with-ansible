---
- hosts: all
  become: yes
  vars:
    postgres_version: 16
    postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"

  tasks:
    - name: Install PostgreSQL and extensions
      apt:
        name:
          - "postgresql-{{ postgres_version }}"
          - "postgresql-{{ postgres_version }}-partman"
        state: present

    - name: Ensure libicu (pg_search dependency) is installed
      apt:
        name: libicu74
        state: present

    - name: Download pg_search .deb package
      get_url:
        url: "https://github.com/paradedb/paradedb/releases/download/v0.20.5/postgresql-{{ postgres_version }}-pg-search_0.20.5-1PARADEDB-noble_amd64.deb"
        dest: "/tmp/pg_search.deb"

    - name: Install pg_search from local .deb
      apt:
        deb: "/tmp/pg_search.deb"
        state: present

    - name: Update PostgreSQL configuration parameters
      lineinfile:
        path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
        regexp: "^{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - {
            regexp: "^#?listen_addresses",
            line: "listen_addresses = '*' # Listen on all interfaces",
          }
        - { regexp: "^#?max_connections", line: "max_connections = 100" }
        - { regexp: "^#?shared_buffers", line: "shared_buffers = 8GB" }
        - {
            regexp: "^#?effective_cache_size",
            line: "effective_cache_size = 12GB",
          }
        - {
            regexp: "^#?maintenance_work_mem",
            line: "maintenance_work_mem = 1GB",
          }
        - {
            regexp: "^#?checkpoint_completion_target",
            line: "checkpoint_completion_target = 0.9",
          }
        - { regexp: "^#?wal_buffers", line: "wal_buffers = 16MB" }
        - {
            regexp: "^#?default_statistics_target",
            line: "default_statistics_target = 500",
          }
        - { regexp: "^#?random_page_cost", line: "random_page_cost = 1.1" }
        - {
            regexp: "^#?effective_io_concurrency",
            line: "effective_io_concurrency = 200",
          }
        - { regexp: "^#?work_mem", line: "work_mem = 10485kB" }
        - { regexp: "^#?huge_pages", line: "huge_pages = try" }
        - { regexp: "^#?min_wal_size", line: "min_wal_size = 1GB" }
        - { regexp: "^#?max_wal_size", line: "max_wal_size = 4GB" }
        - {
            regexp: "^#?max_worker_processes",
            line: "max_worker_processes = 4",
          }
        - {
            regexp: "^#?max_parallel_workers_per_gather",
            line: "max_parallel_workers_per_gather = 2",
          }
        - {
            regexp: "^#?max_parallel_workers",
            line: "max_parallel_workers = 4",
          }
        - {
            regexp: "^#?max_parallel_maintenance_workers",
            line: "max_parallel_maintenance_workers = 2",
          }
        - {
            regexp: "^#?shared_preload_libraries",
            line: "shared_preload_libraries = 'pg_search, pg_partman_bgw, pg_prewarm'",
          }
      notify:
        - Restart PostgreSQL

    - name: Ensure shared_preload_libraries is not overridden in postgresql.auto.conf
      lineinfile:
        path: "/var/lib/postgresql/{{ postgres_version }}/main/postgresql.auto.conf"
        regexp: "^shared_preload_libraries"
        state: absent

    - name: Allow login from local LAN CIDR in pg_hba.conf
      lineinfile:
        path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
        line: "host    all             all             192.168.0.0/16            md5"
        insertafter: EOF
      notify:
        - Restart PostgreSQL

    - name: Allow login from docker CIDR in pg_hba.conf
      lineinfile:
        path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
        line: "host    all             all             172.16.0.0/16            md5"
        insertafter: EOF
      notify:
        - Restart PostgreSQL

    - name: Allow login from local LAN CIDR in pg_hba.conf
      lineinfile:
        path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
        line: "host    all             all             172.19.0.0/16            md5"
        insertafter: EOF
      notify:
        - Restart PostgreSQL

    - name: Allow password authentication in pg_hba.conf
      lineinfile:
        path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
        line: "host    all             all             192.168.0.0/16            md5"
        insertafter: "^# IPv4 local connections:"
      notify:
        - Restart PostgreSQL

    - name: Allow password authentication in pg_hba.conf
      lineinfile:
        path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
        line: "host    all             all             172.16.0.0/16            md5"
        insertafter: "^# IPv4 local connections:"
      notify:
        - Restart PostgreSQL

    - name: Allow password authentication in pg_hba.conf
      lineinfile:
        path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
        line: "host    all             all             172.19.0.0/16            md5"
        insertafter: "^# IPv4 local connections:"
      notify:
        - Restart PostgreSQL

    - name: Check if PostgreSQL password environment variable is set
      fail:
        msg: "POSTGRES_PASSWORD environment variable is not set. Please set the environment variable."
      when: postgres_password == ''

    - name: Ensure PostgreSQL is started
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Flush handlers to apply configuration changes
      meta: flush_handlers

    - name: Set password for the default PostgreSQL user
      command: sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD '{{ postgres_password }}';"

    - name: Create fragrantica database
      command: sudo -u postgres psql -c "CREATE DATABASE fragrantica;"
      register: create_db_out
      failed_when: "create_db_out.rc != 0 and 'already exists' not in create_db_out.stderr"
      changed_when: "create_db_out.rc == 0"

    - name: Enable pg_prewarm autoprewarm
      command: sudo -u postgres psql -c "ALTER SYSTEM SET pg_prewarm.autoprewarm = 'on';"
      notify:
        - Restart PostgreSQL

    - name: Create PostgreSQL extensions
      command: sudo -u postgres psql -d fragrantica -c "CREATE EXTENSION IF NOT EXISTS {{ item }};"
      loop:
        - pg_prewarm
        - pg_partman
        - pg_search

    - name: Prewarm hot tables
      command: >
        sudo -u postgres psql -d fragrantica -c "
          SELECT pg_prewarm('perfumes');
          SELECT pg_prewarm('brands');
          SELECT pg_prewarm('products');
          SELECT pg_prewarm('urlsinproducts');
        "
      changed_when: false
      failed_when: false

  handlers:
    - name: Restart PostgreSQL
      systemd:
        state: restarted
        daemon_reload: yes
        name: postgresql
